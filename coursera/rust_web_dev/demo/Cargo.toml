[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.3.6", features = ["postgres", "r2d2"]}
dotenvy = "0.15.7"
regex = "1.12.3"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
rocket_sync_db_pools = { version = "0.1.0", features = ["diesel_postgres_pool"] }